{% extends "adminlayout.html" %}

{% block title %}
    Users
{% endblock %}

{% block main %}
<div class='container p-4'>
    <h3 class='m-2 d-flex justify-content-center fw-bold text-success'>User Bio-data</h3>
    <table class='table table-striped-columns border-dark table-hover table-bordered'>
        <thead>
            <tr>
                <th>Id</th>
                <th>Name</th>
                <th>Phone Number</th>
                <th>Email</th>
            </tr>
        </thead>
        <tbody class='table-group-divider'>
            {% for user in users %}
            <tr>
                <td>{{ user.id }}</td>
                <td>{{ user.name }}</td>
                <td>{{ user.phone }}</td>
                <td>{{ user.email }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>


{% endblock %}
